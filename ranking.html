<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking en vivo — Streaming Room T3</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050f;--c1:#ffe600;--c2:#00f0ff;--c3:#ff2bd6;
--mono:"Exo 2",ui-monospace,"Courier New",monospace;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:#fff;font:700 14px/1.2 var(--sans)}
body{display:flex;align-items:flex-start;justify-content:flex-end;padding:20px}
#panel{padding:4px 6px}
#list{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:230px}
.col{--c:var(--c1);width:92px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col.b2{--c:var(--c2)}.col.b3{--c:var(--c3)}
.n{width:100%;padding:8px 10px;margin:0 -10px -2px;box-sizing:content-box;text-align:center;font:800 13px/1.2 var(--sans);letter-spacing:.02em;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000a,0 0 9px color-mix(in srgb,var(--c) 70%,transparent)}
.col.b1 .n{font-size:15px;color:var(--c);text-shadow:0 1px 3px #000a,0 0 10px color-mix(in srgb,var(--c) 75%,transparent)}
.bar{width:44px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;border-radius:7px 7px 0 0;
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 40%,#07050f) 0,color-mix(in srgb,var(--c) 8%,#07050f) 100%);
 border:2px solid var(--c);border-bottom:0;box-shadow:0 0 8px var(--c),0 0 22px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 30%,transparent);
 transition:height .8s var(--ease)}
.b1 .bar{height:150px}.b2 .bar{height:112px}.b3 .bar{height:82px}
.p{font:900 italic 11px/1 var(--mono);color:var(--c);opacity:.9;letter-spacing:.04em}
.s{font:900 20px/1 var(--mono);color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 8px var(--c);margin-top:4px}
.b1 .s{font-size:24px}.b3 .s{font-size:18px}
.col.empty{opacity:.35}
.col.empty .n{text-shadow:none;color:#fff}
.col.fresh .s{animation:pop .7s var(--ease)}
.col.swap .n{animation:in .5s var(--ease)}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</head>
<body>
<div id="panel">
  <div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="fb-config.js?v=18"></script>
<script src="fb.js?v=22"></script>
<script>
var cur=[],gen=null,fresh={},slots=[],lastUid=[];
// Podio: orden visual 2 · 1 · 3 (el 1° al centro y más alto).
function build(){
  var box=$("list");box.innerHTML="";
  [1,0,2].forEach(function(i){
    var e=document.createElement("div");
    e.innerHTML='<div class="n"></div><div class="bar"><div class="p">#'+(i+1)+'</div><div class="s"></div></div>';
    box.appendChild(e);slots[i]=e;
  });
}
function paint(){
  var list=cur.slice(0,3);
  slots.forEach(function(e,i){
    var r=list[i],uid=r?r.uid:null;
    e.className="col b"+(i+1)+(r?"":" empty")+(r&&fresh[uid]?" fresh":"")+(r&&lastUid[i]&&lastUid[i]!==uid?" swap":"");
    e.querySelector(".n").textContent=r?r.name:"—";
    e.querySelector(".s").textContent=r?r.score:"";
    lastUid[i]=uid;
  });
  fresh={};
}
function $(i){return document.getElementById(i)}
function start(){
  FB.watchCfg(function(c){
    if(c.gen!==gen){
      gen=c.gen;
      FB.watchScores(function(l){
        var prev={};cur.forEach(function(x){prev[x.uid]=x.score});
        fresh={};
        l.forEach(function(x){if(prev[x.uid]!==undefined&&prev[x.uid]!==x.score)fresh[x.uid]=1});
        cur=l;paint();
      });
    }
  });
}
build();
if(FB.shared())FB.readCfg().then(start);
paint();
</script>
</body>
</html>
