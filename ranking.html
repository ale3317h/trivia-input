<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking en vivo — Streaming Room T3</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#ffd60a;--c2:#22e4ff;--c3:#ff3fd2;
--num:"Exo 2",system-ui,sans-serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:#fff;font:700 14px/1.2 var(--sans)}
body{display:flex;align-items:flex-start;justify-content:flex-end;padding:20px}
#podio{display:flex;align-items:flex-end;gap:10px}
.col{--c:var(--c1);width:92px;display:flex;flex-direction:column;align-items:center}
.col.b1{width:112px}
.col.b2{--c:var(--c2)}.col.b3{--c:var(--c3)}
/* quién: nombre y puntaje parados arriba del escalón */
.n{max-width:100%;font:700 13px/1.15 var(--sans);color:#fff;white-space:nowrap;text-align:center;
 text-shadow:0 1px 2px #000,0 0 8px #000c}
.b1 .n{font:800 16px/1.15 var(--sans)}
.s{margin:3px 0 7px;font:700 12px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--c);white-space:nowrap;
 text-shadow:0 1px 2px #000,0 0 8px color-mix(in srgb,var(--c) 50%,transparent)}
.b1 .s{font-size:15px}
/* escalón: fino, separado, borde neón arriba */
.step{position:relative;width:100%;height:0;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,#0c0a16) 0,#0c0a16eb 75%);
 border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-top:2px solid var(--c);border-bottom:0;border-radius:8px 8px 0 0;
 box-shadow:0 -4px 14px -5px var(--c),inset 0 8px 14px -10px var(--c);
 transition:height .9s var(--ease)}
.b1 .step{height:132px;box-shadow:0 -6px 22px -5px var(--c),inset 0 10px 18px -10px var(--c)}
.b2 .step{height:90px}.b3 .step{height:66px}
/* tabular-nums: cada dígito ocupa el mismo ancho, así el «1» queda centrado */
.p{font:600 32px/1 var(--num);font-variant-numeric:tabular-nums;text-align:center;color:var(--c);
 text-shadow:0 0 10px color-mix(in srgb,var(--c) 65%,transparent)}
.b1 .p{font-size:50px;font-weight:700}.b3 .p{font-size:28px}
.col.empty .n,.col.empty .s{opacity:.35}
.col.empty .p{opacity:.4}
.col.fresh .s{animation:pop .6s var(--ease)}
.col.swap .n{animation:in .45s var(--ease)}
@keyframes pop{0%{transform:scale(1.3)}100%{transform:none}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body:not(.ready) .step{height:0!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</head>
<body>
<div id="podio"></div>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="fb-config.js?v=18"></script>
<script src="fb.js?v=23"></script>
<script>
var cur=[],gen=null,fresh={},slots=[],lastUid=[];
var fmt=new Intl.NumberFormat("es-AR");
function $(i){return document.getElementById(i)}
// Nombres largos se cortan a mano (sin overflow:hidden, que recorta la sombra en forma de caja).
function corto(s){s=String(s||"").trim();return s.length>12?s.slice(0,11).trim()+"…":s}
// Podio: orden visual 2 · 1 · 3 (el 1° al centro y más alto).
function build(){
  var box=$("podio");box.innerHTML="";
  [1,0,2].forEach(function(i){
    var e=document.createElement("div");
    e.innerHTML='<div class="n"></div><div class="s"></div><div class="step"><div class="p">'+(i+1)+'</div></div>';
    box.appendChild(e);slots[i]=e;
  });
}
function paint(){
  var list=cur.slice(0,3);
  slots.forEach(function(e,i){
    var r=list[i],uid=r?r.uid:null;
    e.className="col b"+(i+1)+(r?"":" empty")+(r&&fresh[uid]?" fresh":"")+(r&&lastUid[i]&&lastUid[i]!==uid?" swap":"");
    e.querySelector(".n").textContent=r?corto(r.name):"—";
    e.querySelector(".s").textContent=r?fmt.format(r.score)+" pts":"—";
    lastUid[i]=uid;
  });
  fresh={};
}
function start(){
  FB.watchCfg(function(c){
    if(c.gen!==gen){
      gen=c.gen;
      FB.watchScores(function(l){
        var prev={};cur.forEach(function(x){prev[x.uid]=x.score});
        fresh={};
        l.forEach(function(x){if(prev[x.uid]!==undefined&&prev[x.uid]!==x.score)fresh[x.uid]=1});
        cur=l;paint();
      });
    }
  });
}
build();paint();
requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.add("ready")})});
// ?demo=1 muestra datos de prueba (para acomodar la fuente en OBS sin jugadores).
if(new URLSearchParams(location.search).get("demo")==="1"){
  cur=[{uid:"a",name:"hola",score:152843},{uid:"b",name:"Santiago",score:78056},{uid:"c",name:"wachin",score:263}];paint();
}else if(window.FB&&FB.shared())FB.readCfg().then(start);
</script>
</body>
</html>
