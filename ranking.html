<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking en vivo — Streaming Room T3</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#ffd60a;--c2:#22e4ff;--c3:#ff3fd2;
--num:"Exo 2",system-ui,sans-serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:#fff;font:700 14px/1.2 var(--sans)}
body{display:flex;align-items:flex-start;justify-content:flex-end;padding:20px}
#podio{display:flex;align-items:flex-end;gap:6px}
.col{--c:var(--c1);width:104px;display:flex;flex-direction:column;align-items:center}
.col.b2{--c:var(--c2)}.col.b3{--c:var(--c3)}
/* puntaje: arriba de la barra, nunca adentro */
.s{font:800 20px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em;color:#fff;white-space:nowrap;
 text-shadow:0 1px 2px #000c,0 0 14px color-mix(in srgb,var(--c) 45%,transparent);margin-bottom:8px}
.b1 .s{font-size:24px}
/* barra: tubo de luz fino */
.bar{width:12px;border-radius:6px;height:0;
 background:linear-gradient(180deg,#fff 0,var(--c) 10px,color-mix(in srgb,var(--c) 35%,transparent) 100%);
 box-shadow:0 0 6px var(--c),0 0 18px color-mix(in srgb,var(--c) 55%,transparent);
 transition:height 1s var(--ease)}
.b1 .bar{height:120px}.b2 .bar{height:82px}.b3 .bar{height:54px}
/* puesto + nombre: debajo, sobre la misma línea de base */
.p{margin-top:10px;font:800 12px/1 var(--num);letter-spacing:.18em;color:var(--c);text-shadow:0 1px 2px #000c}
.n{margin-top:4px;max-width:100%;font:800 14px/1.15 var(--sans);color:#fff;white-space:nowrap;text-align:center;
 text-shadow:0 1px 2px #000,0 0 10px #000a}
.b1 .n{font-size:15px;color:var(--c1)}
.col.empty .s,.col.empty .n{opacity:.4}
.col.empty .bar{opacity:.25;box-shadow:none}
.col.fresh .s{animation:pop .6s var(--ease)}
.col.swap .n{animation:in .45s var(--ease)}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:none}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body:not(.ready) .bar{height:0!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</head>
<body>
<div id="podio"></div>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="fb-config.js?v=18"></script>
<script src="fb.js?v=22"></script>
<script>
var cur=[],gen=null,fresh={},slots=[],lastUid=[];
var fmt=new Intl.NumberFormat("es-AR");
function $(i){return document.getElementById(i)}
// Nombres largos se cortan a mano (sin overflow:hidden, que recorta la sombra en forma de caja).
function corto(s){s=String(s||"").trim();return s.length>12?s.slice(0,11).trim()+"…":s}
// Podio: orden visual 2 · 1 · 3 (el 1° al centro y más alto).
function build(){
  var box=$("podio");box.innerHTML="";
  [1,0,2].forEach(function(i){
    var e=document.createElement("div");
    e.innerHTML='<div class="s"></div><div class="bar"></div><div class="p">0'+(i+1)+'</div><div class="n"></div>';
    box.appendChild(e);slots[i]=e;
  });
}
function paint(){
  var list=cur.slice(0,3);
  slots.forEach(function(e,i){
    var r=list[i],uid=r?r.uid:null;
    e.className="col b"+(i+1)+(r?"":" empty")+(r&&fresh[uid]?" fresh":"")+(r&&lastUid[i]&&lastUid[i]!==uid?" swap":"");
    e.querySelector(".n").textContent=r?corto(r.name):"—";
    e.querySelector(".s").textContent=r?fmt.format(r.score):"0";
    lastUid[i]=uid;
  });
  fresh={};
}
function start(){
  FB.watchCfg(function(c){
    if(c.gen!==gen){
      gen=c.gen;
      FB.watchScores(function(l){
        var prev={};cur.forEach(function(x){prev[x.uid]=x.score});
        fresh={};
        l.forEach(function(x){if(prev[x.uid]!==undefined&&prev[x.uid]!==x.score)fresh[x.uid]=1});
        cur=l;paint();
      });
    }
  });
}
build();paint();
requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.add("ready")})});
// ?demo=1 muestra datos de prueba (para acomodar la fuente en OBS sin jugadores).
if(new URLSearchParams(location.search).get("demo")==="1"){
  cur=[{uid:"a",name:"hola",score:152843},{uid:"b",name:"Santiago",score:78056},{uid:"c",name:"wachin",score:263}];paint();
}else if(window.FB&&FB.shared())FB.readCfg().then(start);
</script>
</body>
</html>
