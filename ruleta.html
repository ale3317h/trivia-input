<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruleta · Streaming Room T3</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0f1b3d;--card:#16254d;--tx:#f4f6ff;--mut:#b8c4ee;--yel:#ffe14d;--grn:#3dff8a;--red:#ff4d5e}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 'Segoe UI',Arial,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow-x:hidden}
body:before{content:"";position:fixed;right:-180px;top:-180px;width:520px;height:520px;border-radius:50%;background:#1d3a8a;opacity:.5;pointer-events:none}
body:after{content:"";position:fixed;left:-140px;bottom:-200px;width:440px;height:440px;border-radius:50%;background:#7c3aed;opacity:.35;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;letter-spacing:-.03em}
.pill{background:#ffffff1f;border:2px solid #ffffff40;border-radius:40px;padding:8px 18px;font-weight:700;white-space:nowrap}
.pill.live:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#94a3b8;margin-right:8px;vertical-align:middle}
.pill.live.on:before{background:var(--grn);box-shadow:0 0 10px var(--grn)}
.pill.live.off:before{background:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.wheelbox{position:relative;width:min(92vw,66vh,560px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--yel);filter:drop-shadow(0 3px 6px #0008);z-index:3}
.hub{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#0f1b3d;border:4px solid var(--yel);display:grid;place-items:center;font-size:clamp(1.2rem,4vw,2rem);z-index:2}
#go{width:min(92vw,420px);border:0;border-radius:18px;padding:16px;font:800 1.5rem/1 'Segoe UI',Arial,sans-serif;letter-spacing:.06em;background:var(--yel);color:#1a1000;cursor:pointer;box-shadow:0 0 28px -4px var(--yel)}
#go:disabled{background:#ffffff14;color:#ffffff66;box-shadow:none;cursor:default}
.card{background:var(--card);border:1.5px solid #ffffff22;border-radius:22px;padding:16px}
.card h2{font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.leg{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff14}
.li:last-child{border-bottom:0}
.sw{width:16px;height:16px;border-radius:5px;flex:none}
.li .nm{flex:1;font-weight:700}
.li .pr{font-size:.85rem;color:var(--mut);width:56px;text-align:right}
.li .qn{font-weight:800;min-width:60px;text-align:right}
.li.z{opacity:.45}.li.z .qn{color:var(--red)}
.res{margin-top:14px;text-align:center}
.res .big{font-size:clamp(3rem,12vw,5rem);line-height:1}
.res .t{font:800 clamp(1.4rem,5vw,2.2rem)/1.1 'Segoe UI',Arial,sans-serif;margin:6px 0}
.res .s{color:var(--mut)}
.hist{max-height:190px;overflow:auto;font-size:.95rem}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #ffffff14}
button.p{border:2px solid #ffffff40;background:transparent;color:var(--tx);border-radius:12px;padding:10px 14px;font:700 .95rem 'Segoe UI',Arial,sans-serif;cursor:pointer;margin-top:10px}
button.p:disabled{opacity:.4;cursor:default}
.msg{min-height:1.3em;text-align:center;color:var(--mut);font-size:.95rem}
.msg.err{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🎡 Ruleta ST3 Room</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill" id="turno">Turno mañana</span>
      <span class="pill live" id="live">Conectando…</span>
    </div>
  </div>

  <div class="grid">
    <div class="stage">
      <div class="wheelbox">
        <div class="ptr"></div>
        <canvas id="cv" width="900" height="900"></canvas>
        <div class="hub">ST3</div>
      </div>
      <button id="go" onclick="girar()">GIRAR</button>
      <div class="msg" id="msg"></div>
      <div class="res" id="res"></div>
    </div>

    <div>
      <div class="card">
        <h2>Premios y probabilidad</h2>
        <div class="leg" id="leg"></div>
        <p class="s" style="color:var(--mut);font-size:.85rem;margin-top:8px">La probabilidad sale de lo que queda en el stock del turno: cuanto más stock, más seguido sale. Un premio sin stock deja de salir.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Últimos giros</h2>
        <div class="hist" id="hist"></div>
        <button class="p" id="undo" onclick="deshacer()" disabled>DESHACER EL ÚLTIMO GIRO</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="fb-config.js?v=18"></script>
<script src="fb.js?v=18"></script>
<script src="sheet-config.js?v=1"></script>
<script src="sheet.js?v=1"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var ITEMS=[
    {k:"Stickers",e:"⭐",c:"#f59e0b",n:"Sticker"},
    {k:"Llavero 3D",e:"🧊",c:"#38bdf8",n:"Llavero 3D"},
    {k:"Lapicera",e:"✏️",c:"#ef4444",n:"Lapicera"},
    {k:"Cuaderno",e:"📒",c:"#a855f7",n:"Cuaderno"},
    {k:"Vaso",e:"🥤",c:"#22c55e",n:"Vaso"},
    {k:"Llavero plano",e:"🔑",c:"#3b82f6",n:"Llavero plano"},
    {k:"Llavero grande",e:"🗝️",c:"#eab308",n:"Llavero grande"},
    {k:"Lapicera personalizada",e:"🖊️",c:"#ec4899",n:"Lapicera personalizada"}
  ];
  var TAU=Math.PI*2,rot=0,spinning=false,frozen=null,hist=[];
  try{hist=JSON.parse(localStorage.getItem("ruleta_hist")||"[]")||[]}catch(e){}
  var cv=$("cv"),g=cv.getContext("2d");

  function turno(){return (window.FB&&FB.cfg&&FB.cfg().turno)||"manana"}
  function slices(){
    var t=turno(),list=[],tot=0;
    ITEMS.forEach(function(it){var q=ST3Sheet.quedan(t,it.k);var w=q===null?0:Math.max(0,q);list.push({it:it,q:q,w:w});tot+=w});
    var a=0;list.forEach(function(s){s.p=tot?s.w/tot:0;s.a0=a;a+=s.p*TAU;s.a1=a});
    return {list:list,tot:tot};
  }
  function draw(S){
    var W=cv.width,R=W/2-14,cx=W/2,cy=W/2;
    g.clearRect(0,0,W,W);
    g.save();g.translate(cx,cy);g.rotate(rot);
    if(!S.tot){g.beginPath();g.arc(0,0,R,0,TAU);g.fillStyle="#1f2a52";g.fill()}
    S.list.forEach(function(s){
      if(s.w<=0)return;
      var a0=s.a0-Math.PI/2,a1=s.a1-Math.PI/2;
      g.beginPath();g.moveTo(0,0);g.arc(0,0,R,a0,a1);g.closePath();
      g.fillStyle=s.it.c;g.fill();g.lineWidth=5;g.strokeStyle="#0f1b3d";g.stroke();
      var mid=(a0+a1)/2,ang=s.a1-s.a0;
      if(ang>0.22){
        g.save();g.rotate(mid);g.textAlign="right";g.fillStyle="#fff";g.shadowColor="#0008";g.shadowBlur=6;
        g.font="700 "+Math.round(W*(ang>0.5?.05:.038))+"px Segoe UI,Arial,sans-serif";
        g.fillText(s.it.n,R-W*.045,W*.017);
        if(ang>0.5){g.font=Math.round(W*.06)+"px Segoe UI Emoji,Apple Color Emoji,sans-serif";g.textAlign="center";g.fillText(s.it.e,R*.42,W*.022)}
        g.restore();
      }
    });
    g.restore();
    g.beginPath();g.arc(cx,cy,R+4,0,TAU);g.lineWidth=10;g.strokeStyle="#ffe14d";g.stroke();
  }
  function paintLegend(S){
    $("leg").innerHTML=S.list.map(function(s){
      return '<div class="li'+(s.w<=0?' z':'')+'"><span class="sw" style="background:'+s.it.c+'"></span><span class="nm">'+s.it.e+' '+s.it.n+'</span><span class="pr">'+(s.w>0?(s.p*100).toFixed(1).replace(".",",")+'%':'')+'</span><span class="qn">'+(s.q===null?'—':(s.q<=0?'sin stock':s.q))+'</span></div>';
    }).join("");
  }
  function paintHist(){
    $("hist").innerHTML=hist.length?hist.slice().reverse().map(function(h){return '<div><span>'+h.e+' '+h.n+(h.undone?' <i style="color:#ff4d5e">(deshecho)</i>':'')+'</span><span style="color:#b8c4ee">'+h.h+'</span></div>'}).join(""):'<div style="color:#b8c4ee">Todavía no hubo giros en este dispositivo.</div>';
    var last=hist[hist.length-1];$("undo").disabled=spinning||!last||last.undone;
  }
  function paint(){
    if(spinning)return;
    var S=slices();draw(S);paintLegend(S);paintHist();
    $("turno").textContent=turno()==="tarde"?"Turno tarde":"Turno mañana";
    var live=$("live"),at=ST3Sheet.leyo();
    live.className="pill live "+(at?"on":"off");live.textContent=at?"Stock en vivo":"Sin conexión con la planilla";
    var go=$("go");
    if(!S.tot){go.disabled=true;go.textContent=at?"SIN STOCK EN ESTE TURNO":"SIN DATOS DEL STOCK"}
    else{go.disabled=false;go.textContent="GIRAR"}
    if(!S.tot&&!at)$("msg").textContent="No se pudo leer el stock. Revisá la conexión.";
  }
  function pick(S){
    var r=Math.random()*S.tot,acc=0;
    for(var i=0;i<S.list.length;i++){acc+=S.list[i].w;if(r<acc&&S.list[i].w>0)return S.list[i]}
    return S.list.filter(function(s){return s.w>0})[0];
  }
  function ease(t){return 1-Math.pow(1-t,3.2)}
  function hora(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2)}

  window.girar=function(){
    if(spinning)return;
    var S=slices();if(!S.tot)return paint();
    var w=pick(S),t=turno(),code="r-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
    spinning=true;frozen=S;$("go").disabled=true;$("undo").disabled=true;$("res").innerHTML="";$("msg").className="msg";$("msg").textContent="Girando…";
    // se descuenta ya, para que otra ruleta no entregue el mismo premio
    var cons=ST3Sheet.consume(t,w.it.k,code).then(function(){return true},function(){return false});
    // el punto de la porción ganadora que queda bajo la flecha
    var theta=w.a0+(w.a1-w.a0)*(0.15+Math.random()*0.7);
    var from=rot,target=Math.ceil(from/TAU)*TAU+TAU*(6+Math.floor(Math.random()*2))-theta,t0=performance.now(),dur=5600;
    (function frame(now){
      var k=Math.min(1,(now-t0)/dur);rot=from+(target-from)*ease(k);draw(S);
      if(k<1)return requestAnimationFrame(frame);
      rot=target%TAU;spinning=false;frozen=null;
      cons.then(function(ok){
        hist.push({k:w.it.k,n:w.it.n,e:w.it.e,code:code,t:t,h:hora(),ok:ok});if(hist.length>30)hist=hist.slice(-30);
        try{localStorage.setItem("ruleta_hist",JSON.stringify(hist))}catch(e){}
        $("res").innerHTML='<div class="big">'+w.it.e+'</div><div class="t" style="color:'+w.it.c+'">¡'+w.it.n+'!</div><div class="s">Entregar 1 '+w.it.n.toLowerCase()+'</div>';
        $("msg").className="msg"+(ok?"":" err");$("msg").textContent=ok?"":"⚠ No se pudo descontar del stock (sin conexión). Avisá a producción.";
        paint();
      });
    })(t0);
  };
  window.deshacer=function(){
    var last=hist[hist.length-1];if(!last||last.undone||spinning)return;
    if(!confirm("¿Deshacer el último giro ("+last.n+")? Se devuelve al stock."))return;
    ST3Sheet.release(last.t,last.k,last.code).then(function(){last.undone=true;try{localStorage.setItem("ruleta_hist",JSON.stringify(hist))}catch(e){}$("res").innerHTML="";$("msg").className="msg";$("msg").textContent="Giro deshecho: el premio volvió al stock.";paint()},
      function(){$("msg").className="msg err";$("msg").textContent="No se pudo deshacer (sin conexión)."});
  };

  ST3Sheet.onChange(paint);
  paint();
  setInterval(function(){if(!spinning)paint()},5000);
})();
</script>
</body>
</html>
