<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Girar la ruleta · Streaming Room T3</title>
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#151515;color:#f3f1ea;font:500 17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:20px;
  background:radial-gradient(900px 500px at 50% -10%,#2a2410 0,#151515 60%)}
.box{width:min(440px,100%);text-align:center;background:#1e1e1e;border:3px solid #e9e7e0;border-radius:22px;
  box-shadow:0 0 0 7px #121212,0 30px 80px -20px #000;padding:28px 22px}
.brand{font-weight:800;letter-spacing:.14em;font-size:.72rem;color:#b9b5aa;margin-bottom:10px}
.em{font-size:3.4rem;line-height:1;margin:6px 0}
h1{margin:6px 0 8px;font-size:1.7rem;line-height:1.15;color:#f6d27a}
p{margin:6px 0;color:#d6d2c6}
small{color:#9a968b}
.ok h1{color:#4ade80}.bad h1{color:#ff8a80}
.dots i{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:#f6d27a;animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
</style>
</head>
<body>
<div class="box" id="box"><div class="brand">★ STREAMING ROOM T3 ★</div><div class="em">🎡</div><h1>Un momento…</h1><p class="dots"><i></i><i></i><i></i></p></div>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="fb-config.js?v=18"></script>
<script>
(function(){
/* =============================================================
   Canje del QR de la ruleta. El stand genera un QR único (ruleta-pizarron.html);
   al escanearlo acá, ese QR queda usado y la ruleta gira una sola vez.
   Cada celular puede girar una sola vez: se recuerda en el celular (guardado y cookie)
   y en la base (cfg/rt/d/<celular>).
     cfg/rt/q/<código> = {t, s:'open'|'ok'|'exp'|'x', u, ts}
     cfg/rt/d/<celular> = {q, ts}
   ============================================================= */
var $=function(i){return document.getElementById(i)};
var VENCE=120000;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pintar(em,tit,txt,cls){
  $("box").className="box "+(cls||"");
  $("box").innerHTML='<div class="brand">★ STREAMING ROOM T3 ★</div><div class="em">'+em+'</div><h1>'+tit+'</h1>'+(txt||"");
}
function dev(){
  var k="rt_dev",v=null,m;
  try{v=localStorage.getItem(k)}catch(e){}
  if(!v){m=document.cookie.match(/(?:^|; )rt_dev=([^;]+)/);if(m)v=m[1]}
  if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
  try{localStorage.setItem(k,v)}catch(e){}
  try{document.cookie="rt_dev="+v+"; max-age=31536000; path=/; SameSite=Lax"}catch(e){}
  return v;
}
var yaGiro=function(){pintar("✋","Ya giraste la ruleta","<p>Solo se puede girar <b>una vez por persona</b>. ¡Gracias por participar!</p>","bad")};
async function main(){
  var tk=(new URLSearchParams(location.search).get("t")||"").replace(/[^a-z0-9]/gi,"");
  if(!tk){pintar("📷","Escaneá el QR de la ruleta","<p>Este QR está en la pantalla de la ruleta del stand. Escanealo desde ahí para girar.</p>");return}
  var d;try{var app;try{app=firebase.app()}catch(e){app=firebase.initializeApp(window.FB_CONFIG)}d=firebase.database()}catch(e){pintar("📡","Sin conexión","<p>No pudimos conectar. Revisá tu internet y volvé a escanear el QR.</p>","bad");return}
  var DV=dev();
  try{
    var off=(await d.ref(".info/serverTimeOffset").once("value")).val()||0;
    if((await d.ref("cfg/rt/d/"+DV).once("value")).val()){yaGiro();return}
    var q=(await d.ref("cfg/rt/q/"+tk).once("value")).val();
    if(!q){pintar("❌","QR no válido","<p>Pedile al encargado de la ruleta que genere uno nuevo.</p>","bad");return}
    if(q.s!=="open"||Date.now()+off-(q.t||0)>VENCE){pintar("⌛","Este QR ya no sirve","<p>Cada QR se usa <b>una sola vez</b> y vence a los 2 minutos. Pedile uno nuevo al encargado.</p>","bad");return}
    // 1) se reserva el celular (si ya giró, se corta); 2) se canjea el QR (si otro lo ganó, se libera el celular)
    var lk=await d.ref("cfg/rt/d/"+DV).transaction(function(c){if(c)return;return{q:tk,ts:firebase.database.ServerValue.TIMESTAMP}});
    if(!lk.committed){yaGiro();return}
    var rs=await d.ref("cfg/rt/q/"+tk).transaction(function(c){
      if(c===null)return c;   // primera pasada sin datos: Firebase reintenta con el valor real
      if(c.s!=="open"||Date.now()+off-(c.t||0)>VENCE)return;
      c.s="ok";c.u=DV;c.ts=firebase.database.ServerValue.TIMESTAMP;return c});
    if(!rs.committed){await d.ref("cfg/rt/d/"+DV).remove();pintar("⌛","Este QR ya no sirve","<p>Se usó o venció. Pedile uno nuevo al encargado.</p>","bad");return}
    pintar("🎉","¡Listo!","<p>Mirá la pantalla de la ruleta: <b>ya está girando</b> para vos.</p><small>Este celular ya no puede volver a girar.</small>","ok");
  }catch(e){pintar("📡","No se pudo","<p>"+esc(e&&e.message||"Error de conexión")+". Probá de nuevo escaneando el QR.</p>","bad")}
}
main();
})();
</script>
</body>
</html>
